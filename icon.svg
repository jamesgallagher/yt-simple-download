<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#16181f"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4b4b"/>
      <stop offset="1" stop-color="#e11d1d"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- red video chip -->
  <g filter="url(#ds)">
    <rect x="112" y="120" width="288" height="196" rx="40" fill="url(#chip)"/>
    <!-- play triangle -->
    <path d="M228 172 L292 218 L228 264 Z" fill="#ffffff"/>
  </g>

  <!-- download arrow -->
  <g fill="#ffffff">
    <rect x="238" y="292" width="36" height="66" rx="18"/>
    <path d="M256 396 L206 336 L306 336 Z"/>
    <!-- tray -->
    <rect x="168" y="404" width="176" height="30" rx="15"/>
  </g>
</svg>
