<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181f">
  <title>Simple Video Download</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_ver }}">
</head>
<body>
  <main class="card">
    <header class="head">
      <img class="logo" src="/static/icon.png" alt="" width="56" height="56">
      <div>
        <h1>Simple Video Download</h1>
        <p class="tag">Pick a service. Paste a link. Grab the file.</p>
      </div>
    </header>

    <form id="form" autocomplete="off">
      <label class="field">
        <span>Service</span>
        <select id="provider" name="provider">
          {% for p in providers %}
          <option value="{{ p.name }}"{% if p.name == default_provider %} selected{% endif %}>{{ p.display }}</option>
          {% endfor %}
        </select>
      </label>

      <div id="preview" class="preview hidden">
        <img id="preview-thumb" class="preview-thumb" alt="" width="120" height="68">
        <div class="preview-meta">
          <div id="preview-title" class="preview-title"></div>
          <div id="preview-sub" class="preview-sub"></div>
        </div>
      </div>

      <label class="field">
        <span id="url-label">Video link</span>
        <input id="url" name="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." required>
        <div id="url-msg" class="url-msg"></div>
      </label>

      <div class="row">
        <div class="field">
          <span>Format</span>
          <div class="seg" role="tablist">
            <input type="radio" name="format" id="fmt-mkv" value="mkv" checked>
            <label for="fmt-mkv">Video · mkv</label>
            <input type="radio" name="format" id="fmt-mp3" value="mp3">
            <label for="fmt-mp3">Audio · mp3</label>
          </div>
        </div>

        <label class="field">
          <span id="quality-label">Quality</span>
          <select id="quality" name="quality"></select>
        </label>
      </div>

      <label class="check">
        <input type="checkbox" id="advanced">
        <span>Advanced options</span>
      </label>

      <div id="advanced-opts" class="row hidden">
        <label class="field">
          <span>Start time</span>
          <input id="start" type="text" inputmode="numeric" placeholder="e.g. 0:30">
        </label>
        <label class="field">
          <span>End time</span>
          <input id="end" type="text" inputmode="numeric" placeholder="e.g. 1:45">
        </label>
        <p class="hint">Trim to a portion of the video. Format: <code>SS</code>, <code>MM:SS</code>, or <code>HH:MM:SS</code>. Leave either blank for start/end of video.</p>
      </div>

      <button id="submit" type="submit" disabled>Download</button>
    </form>

    <section id="status" class="status hidden" aria-live="polite">
      <div class="status-head">
        <span id="status-title" class="status-title">Working…</span>
        <span id="status-stage" class="status-stage"></span>
      </div>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <div id="status-msg" class="status-msg"></div>
      <a id="download-link" class="dl hidden" download>Save file</a>
    </section>

    <footer class="foot">
      <span>Private downloader · single videos only</span>
      <span class="ver">v{{ version }}</span>
    </footer>
  </main>

  <script id="providers-data" type="application/json">{{ providers | tojson }}</script>
  <script src="/static/app.js?v={{ asset_ver }}"></script>
</body>
</html>
